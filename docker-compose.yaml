services:
  api1:
    build: ./api
    container_name: api1
    ports:
      - "3001:3000"
    environment:
      - MESSAGE=${API_MESSAGE_1}
    networks:
      - lab-network
    depends_on:
      - db
  api2:
    build: ./api
    container_name: api2
    ports:
      - "3002:3000"
    environment:
      - MESSAGE=${API_MESSAGE_2}
    networks:
      - lab-network
    depends_on:
      - db
  api3:
    build: ./api
    container_name: api3
    ports:
      - "3003:3000"
    networks:
      - lab-network
    environment:
      - MESSAGE=${API_MESSAGE_3}
    depends_on:
      - db

  db:  
    image: postgres:16-alpine
    container_name: lab_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - lab-network
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
  

volumes:
  db_data:
    driver: local


networks:
  lab-network:
    driver: bridge